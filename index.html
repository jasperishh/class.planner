<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neils Class Planner</title>
<style>
:root{--background:#eef4f6;--foreground:#2b3a42;--card:#fff;--popover:#fff;--primary:#0bb3e6;--secondary:#f5f5f5;--muted:#edf0f1;--muted-foreground:#69757c;--accent:#e6f9ff;--destructive:#e7000b;--border:#d8dfe4;--input:#d8dfe4;--ring:#38d2ff;--radius:1.1rem;--soft-shadow:0 20px 50px #3aa9d117,0 6px 16px #454d530f,inset 0 1px 0 white;--display:"Arial Rounded MT Bold",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;--bounce:cubic-bezier(.34,1.56,.64,1)}
*{box-sizing:border-box}
body{color:#2b3a42;-webkit-text-size-adjust:100%;background:radial-gradient(1000px 560px at 10% -6%,#38d2ff14,#0000 62%),linear-gradient(165deg,#f5f9fb,#eef3f5);background-attachment:fixed;margin:0;font-family:-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;font-size:16px;min-height:100vh}
h1,h2,h3,.brand,.course-stat strong,.summary-ring strong,.overview-count strong,.date-tile b,.day-add>span,.eyebrow{font-family:var(--display);letter-spacing:0}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #1689b4;outline-offset:3px}
button svg{flex-shrink:0}
input,textarea{min-width:0}
h1,h2,h3,p{margin:0}
svg{display:block}
.app{max-width:1780px;margin:auto;padding:24px 28px 72px}
.topbar{justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px;display:flex;flex-wrap:wrap}
.brand{letter-spacing:-.7px;align-items:center;gap:12px;font-size:22px;display:flex}
.brand strong{font-weight:700}
.brand span{color:#8b949b;font-weight:500}
.orb{color:#fff;border:1px solid #35c8f0;border-radius:50%;place-items:center;width:64px;height:64px;display:grid;box-shadow:inset 0 3px 2px #ffffffcc,inset 0 -5px 9px #0000000f,0 10px 22px #2fc5f04d;animation:float 4.5s ease-in-out infinite}
.blue{background:linear-gradient(140deg,#7fe6ff,#22c3f5 55%,#12b0ea)}
.brand:hover .orb{animation:wobble .6s var(--bounce)}
.small-orb{border-radius:15px;width:42px;height:42px}
.top-actions{align-items:center;gap:9px;display:flex;flex-wrap:wrap}
.save-state{color:#638472;align-items:center;gap:6px;margin-right:8px;font-size:12px;display:flex}
.save-state.bad{color:#b26144}
.soft{color:#41616e;background:linear-gradient(#fff,#e9f1f4);border:1px solid #d3e0e5;border-radius:999px;justify-content:center;align-items:center;gap:8px;padding:11px 16px;font-size:14px;font-weight:600;transition:transform .2s var(--bounce),box-shadow .2s;display:inline-flex;box-shadow:0 7px 16px #3aa9d115,inset 0 1px 1px #fff}
.soft:hover:not(:disabled){transform:translateY(-3px) scale(1.04);box-shadow:0 12px 24px #2fbdea2e,inset 0 1px 1px #fff}
.soft:active:not(:disabled){transform:translateY(1px) scale(.97);box-shadow:inset 0 2px 5px #0001}
.soft.primary{color:#0a4256;background:linear-gradient(135deg,#8be9ff,#38d2ff 48%,#12b6ee);border-color:#2fc0ec;box-shadow:inset 0 2px 1px #ffffffcc,0 12px 26px #23c2f04a}
.soft.primary:hover:not(:disabled){box-shadow:0 16px 32px #23c2f05e,inset 0 2px 1px #fff}
.icon-only{width:42px;height:42px;padding:11px}
.bare{color:#788790;background:0 0;border:0;border-radius:8px;justify-content:center;align-items:center;padding:5px;display:inline-flex}
.bare:hover{background:#e8eef1}
.danger{color:#b84d49!important}
.app-layout{grid-template-columns:280px minmax(0,1fr);align-items:start;gap:26px;display:grid}
.rail{min-width:0}
.create{width:100%;margin-bottom:26px;padding:15px;font-size:16px}
.rail-heading{justify-content:space-between;align-items:center;margin:0 4px 15px;display:flex}
.rail-heading h2{color:#65747c;font-size:14px;font-weight:600}
.course-list{gap:14px;display:grid}
.course-card{box-shadow:var(--soft-shadow);background:linear-gradient(150deg,#fff,color-mix(in srgb,var(--c) 7%,#fbfdfd));border:1px solid color-mix(in srgb,var(--c) 22%,#e2e9ee);border-radius:26px;padding:19px;animation:.4s both rise;transition:transform .22s var(--bounce),box-shadow .22s}
.course-card:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 26px 54px color-mix(in srgb,var(--c) 22%,#3aa9d10f),inset 0 1px 0 #fff}
.course-top{align-items:center;gap:10px;display:flex}
.chk{border:1.5px solid #cdd6db;background:#fff;border-radius:6px;width:18px;height:18px;display:inline-grid;place-items:center;flex-shrink:0;color:#fff;box-shadow:inset 0 2px 1px #fff7,0 3px 7px #0001;padding:0}
.chk.on{border-color:var(--c,#149ac9);background:var(--c,#149ac9)}
.chk svg{opacity:0;width:12px;height:12px}
.chk.on svg{opacity:1}
.course-name{text-align:left;overflow-wrap:anywhere;background:0 0;border:0;flex:1;font-size:16px;font-weight:700;line-height:1.4;color:#343434}
.course-card p{color:#77848c;margin-top:9px;font-size:12px}
.course-stat{justify-content:space-between;align-items:center;margin-top:18px;display:flex}
.course-stat strong{font-variant-numeric:tabular-nums;font-size:23px}
.course-stat small{color:#839099;font-size:13px;font-weight:400}
.course-stat>span{color:#839099;font-size:12px}
.meter{background:#edf0f1;border:1px solid #dbe0e3;border-radius:999px;height:9px;margin-top:10px;overflow:hidden;box-shadow:inset 0 2px 4px #525a601c}
.meter i{background:var(--c);border-radius:999px;height:100%;transition:width .6s cubic-bezier(.2,.8,.2,1);display:block;box-shadow:inset 0 2px 1px #fff8}
.finish{color:#6f7d85;align-items:center;gap:6px;margin-top:13px;font-size:12px;display:flex}
.fill{color:#387353;background:linear-gradient(#f5fff9,#eaf9f0);border:1px solid #c8e8d6;border-radius:12px;justify-content:space-between;align-items:center;width:100%;margin-top:12px;padding:9px;font-size:12px;display:flex;gap:6px}
.warning{align-items:center;gap:7px;font-size:13px;line-height:1.5;display:flex;color:#a57831!important;margin-top:9px}
.add-course{width:100%;margin:15px 0 20px}
.rail-link{color:#57727c;background:0 0;border:0;border-radius:14px;align-items:center;gap:10px;width:100%;padding:12px 7px;font-size:14px;display:flex;transition:transform .2s var(--bounce),background .2s}
.rail-link:hover{background:#e2f4fa;transform:translateX(4px)}
.rail-link span{background:#fff;border:1px solid #dce2e5;border-radius:20px;margin-left:auto;padding:1px 8px;font-size:12px}
.rail-empty{color:#8a949b;font-size:13px;padding:6px 4px;line-height:1.5}
.ended-toggle{margin-top:6px;font-weight:600;color:#5a7b86}
.ended-toggle.open{background:#e2f4fa}
.ended-list{gap:14px;display:grid;margin:12px 0 6px;padding-left:8px;border-left:2px dashed #cfdbe1}
.ended-list .course-card{opacity:.92}
.timezone{color:#8a949b;border-top:1px solid #dce2e5;align-items:center;gap:7px;margin-top:8px;padding:20px 7px;font-size:12px;display:flex}
.main-surface{min-width:0}
.overview{align-items:center;gap:30px;min-height:118px;margin:0 4px 23px;display:flex}
.overview>div:first-child{margin-right:auto}
.eyebrow{letter-spacing:1.7px;color:#8b959d;font-size:12px}
.overview h1{letter-spacing:-.7px;margin:4px 0;font-size:32px;font-weight:700;line-height:1.5}
.overview p{color:#7c8990;font-size:14px}
.summary-ring{background:conic-gradient(from -90deg,#22e08e 0,#38d2ff var(--progress),#e3ebee 0);border-radius:50%;flex-shrink:0;width:104px;height:104px;padding:7px;transition:background .6s;box-shadow:0 12px 26px #2fc5f03d,inset 0 2px 3px #fff}
.summary-ring:hover{animation:wobble .6s var(--bounce)}
.summary-ring>div{background:linear-gradient(#fff,#f3f5f5);border-radius:50%;flex-direction:column;justify-content:center;align-items:center;width:100%;height:100%;display:flex;box-shadow:inset 0 1px #fff}
.summary-ring strong{font-size:27px;line-height:1.1}
.summary-ring span{color:#7e8a92;margin-top:4px;font-size:12px}
.overview-count{flex-direction:column;align-items:center;gap:4px;margin-right:15px;display:flex}
.overview-count strong{font-size:30px}
.overview-count span{color:#7e8a92;font-size:12px}
.calendar-panel{box-shadow:var(--soft-shadow);background:linear-gradient(145deg,#fff,#f9fafa);border:1px solid #d7dfe5;border-radius:30px;padding:23px;overflow:hidden}
.calendar-toolbar{flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;display:flex}
.date-navigation{flex-wrap:wrap;align-items:center;gap:7px;display:flex}
.date-navigation h2{margin-left:9px;font-size:21px;font-weight:600;line-height:1.4}
.jump-wrap{position:relative;display:inline-flex;align-items:center;color:#7c8890}
.jump-date{color:transparent;background:0 0;border:0;width:30px;padding:3px;font-size:14px}
.jump-date::-webkit-datetime-edit{display:none}
.jump-date::-webkit-calendar-picker-indicator{opacity:.55;cursor:pointer;width:20px;height:20px;margin:0}
.view-tabs{background:#edf0f1;border:1px solid #d7dde1;box-shadow:inset 0 3px 7px #50596017;border-radius:999px;padding:4px;display:inline-flex;gap:2px}
.view-tabs button{color:#7e8a91;border:1px solid transparent;background:0 0;border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;font-family:var(--display);transition:transform .18s var(--bounce),color .18s}
.view-tabs button:hover{color:#2a94bd;transform:scale(1.06)}
.view-tabs button.active{border:1px solid #d8dee2;box-shadow:0 5px 10px #474e541a,inset 0 1px 1px #fff;color:#495861;background:linear-gradient(#fff,#edf0f1)}
.search-row{justify-content:space-between;align-items:center;gap:14px;padding:20px 0;display:flex;flex-wrap:wrap}
.search{color:#8c979f;background:#f3f6f7;border:1px solid #dde3e7;border-radius:999px;align-items:center;gap:9px;width:100%;max-width:380px;padding:10px 14px;display:flex;box-shadow:inset 0 2px 3px #00000004}
.search input{color:#47565f;background:0 0;border:0;outline:none;width:100%;font-size:14px}
.search-row>span{color:#78898f;white-space:nowrap;align-items:center;gap:5px;font-size:12px;display:flex}
.calendar-scroll{border:1px solid #dce3e7;border-radius:20px;overflow:auto}
.calendar-grid{grid-template-columns:repeat(7,minmax(0,1fr));animation:.25s arrive;display:grid}
.weekday{text-align:center;color:#798790;background:#f5f7f8;border-bottom:1px solid #e1e7ea;padding:12px;font-size:12px}
.day{background:#fff;border-bottom:1px solid #e6ebee;border-right:1px solid #e6ebee;min-width:0;min-height:135px;padding:8px 6px;transition:background .2s}
.day:nth-child(7n){background:#fbfcfc;border-right:0}
.day.outside{background:#f5f7f8}
.day.outside .day-add{color:#a9b3ba}
.day.is-today{background:#f7fcff}
.day.can-drop{background:#e7f6ff;box-shadow:inset 0 0 0 2px #44bdf3}
.day-add{color:#798891;background:0 0;border:0;border-radius:8px;justify-content:space-between;align-items:center;width:100%;padding:1px 4px 6px;font-size:14px;display:flex}
.day-add>svg{opacity:0}
.day-add:hover>svg,.day-add:focus-visible>svg{opacity:1}
.day-add>span{place-items:center;width:26px;height:26px;display:grid;transition:transform .2s var(--bounce)}
.day-add:hover>span{transform:scale(1.18) rotate(-4deg)}
.is-today .day-add>span{color:#18546d;background:linear-gradient(#7bdcff,#43bfee);border-radius:50%;box-shadow:inset 0 2px 1px #fff9,0 3px 6px #36afe126}
.event-chip{text-align:left;background:linear-gradient(145deg,#fff,color-mix(in srgb,var(--c) 17%,white));width:100%;display:block;border:1px solid color-mix(in srgb,var(--c) 32%,white);border-left:3px solid var(--c);overflow-wrap:anywhere;border-radius:11px;margin-top:5px;padding:7px;transition:transform .2s var(--bounce),box-shadow .2s;box-shadow:0 3px 7px #41495108,inset 0 1px #fff}
.event-chip:hover{transform:translateY(-3px) scale(1.03) rotate(-.6deg);box-shadow:0 12px 20px color-mix(in srgb,var(--c) 28%,#41495114)}
.event-line{color:color-mix(in srgb,var(--c) 45%,#34434e);justify-content:space-between;align-items:center;display:flex;font-size:12px}
.event-line b{font-variant-numeric:tabular-nums}
.event-chip strong{margin-top:3px;font-size:14px;font-weight:600;line-height:1.45;display:block}
.event-meta{color:#7a878f;font-size:12px}
.event-chip.cancelled{opacity:.6}
.event-chip.cancelled strong{text-decoration:line-through}
.event-chip.done{background:linear-gradient(#f8fff9,#e9f9ef)}
.event-chip.clash{border-right:3px solid #eeac35}
.holiday{text-align:left;color:#8c763f;overflow-wrap:anywhere;background:linear-gradient(#fffcf3,#fff5d9);border:1px solid #ecdba6;border-radius:8px;width:100%;margin:4px 0;padding:5px;font-size:12px;line-height:1.4;display:block}
.calendar-footer{color:#8a959c;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:17px 2px 0;font-size:12px;display:flex}
.legend-dot{background:#05c366;border-radius:50%;width:7px;height:7px;margin-right:5px;display:inline-block}
.week .day{min-height:400px}
.agenda{gap:12px;animation:.25s arrive;display:grid}
.agenda-row{text-align:left;background:linear-gradient(#fff,#f7fbfc);border:1px solid #d3e2e8;border-radius:24px;align-items:center;gap:15px;padding:12px 18px;transition:transform .2s var(--bounce),box-shadow .2s;display:flex;box-shadow:0 7px 17px #3aa9d112,inset 0 2px 1px #fff;width:100%}
.agenda-row:hover{transform:translateY(-3px) translateX(3px) scale(1.008);box-shadow:0 16px 30px color-mix(in srgb,var(--c) 24%,#3aa9d114)}
.agenda-row.cancelled{opacity:.62}
.date-tile{text-align:center;color:#76858e;min-width:38px}
.date-tile b{color:#495b65;font-size:24px;line-height:1.2;display:block}
.date-tile span{font-size:12px}
.agenda-orb{background:linear-gradient(color-mix(in srgb,var(--c) 70%,white),var(--c));border-radius:50%;place-items:center;width:43px;height:43px;display:grid;border:1px solid var(--c);color:#fff;flex-shrink:0;box-shadow:inset 0 2px 1px #fff9,0 5px 10px #0001}
.agenda-copy{flex:1;min-width:0}
.agenda-copy strong{font-size:16px;display:block}
.agenda-copy>span{color:#88949b;margin-top:4px;font-size:13px;display:block}
.status-pill{color:#6c7e87;white-space:nowrap;background:#f0f4f5;border:1px solid #dfe5e8;border-radius:999px;padding:5px 9px;font-size:12px}
.empty{text-align:center;color:#80929d;flex-direction:column;align-items:center;gap:18px;padding:50px;display:flex}
/* payments dashboard */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 4px 22px}
.stat{background:linear-gradient(150deg,#fff,color-mix(in srgb,var(--a) 8%,#fbfdfd));border:1px solid color-mix(in srgb,var(--a) 24%,#e2e9ee);border-radius:20px;padding:14px 16px;box-shadow:0 12px 26px #3aa9d112,inset 0 1px 0 #fff;transition:transform .22s var(--bounce),box-shadow .22s}
.stat:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 20px 38px color-mix(in srgb,var(--a) 26%,#3aa9d112)}
.stat strong{font-family:var(--display);font-size:1.7rem;color:var(--a);display:block;line-height:1.1;font-variant-numeric:tabular-nums}
.stat strong small{font-size:.9rem;color:#9aa7ae;font-weight:600}
.stat span{color:#6a7a82;font-size:.72rem;margin-top:4px;display:block}
.stat.hot{animation:pulseHot 2.4s ease-in-out infinite}
@keyframes pulseHot{0%,100%{box-shadow:0 12px 26px #e08a1e1f,inset 0 1px 0 #fff}50%{box-shadow:0 16px 34px #e08a1e40,inset 0 1px 0 #fff}}
.money-row{display:flex;justify-content:space-between;gap:8px;margin-top:11px;font-size:12px;color:#3f8763;font-weight:700}
.money-row .due{color:#bd7212}
.money-row .clear{color:#8a949b;font-weight:500}
.chip-marks{display:inline-flex;align-items:center;gap:3px;font-size:11px}
.event-chip.missed{border-left-color:#ff9800;background:linear-gradient(145deg,#fff,#fff4e6)}
.agenda-row.missed{border-color:#f3c98a}
.agenda-row.missed .status-pill{background:#fff1dd;color:#b26a17;border-color:#f0d3a2}
.check-label.pay{background:#eafaf3;border-color:#bfe8d3}
.check-label.pay .chk{--c:#00b585}
.check-label.pay small{color:#5f8a74}
.agenda-main{flex:1;min-width:0;display:flex;align-items:center;gap:15px;background:0 0;border:0;text-align:left;padding:0}
.agenda-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}
.mini{width:34px;height:34px;border-radius:12px;border:1.5px solid #d3e0e5;background:linear-gradient(#fff,#eef4f6);color:#9aa7ae;display:inline-grid;place-items:center;transition:transform .18s var(--bounce),background .18s,color .18s}
.mini:hover{transform:scale(1.12)}
.mini.on{background:linear-gradient(135deg,#4be0a0,#00c9a7);border-color:#00c9a7;color:#fff;box-shadow:0 6px 14px #00c9a740}
.paid-pill{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:#fff1dd;color:#b26a17;border:1px solid #f0d3a2;transition:transform .18s var(--bounce)}
.paid-pill:hover{transform:scale(1.07)}
.paid-pill.paid{background:#d8f7ec;color:#00997d;border-color:#b3ecd9}
@media (max-width:1200px){.stats{gap:10px}.stat strong{font-size:1.4rem}}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}}
.overlay{position:fixed;inset:0;background:#edf0f299;-webkit-backdrop-filter:blur(9px);backdrop-filter:blur(9px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:fade .18s both}
.editor{max-height:90dvh;overflow:auto;background:linear-gradient(145deg,#fff,#f7f8f8);border:1px solid #d5dde3;border-radius:30px;padding:28px;box-shadow:0 25px 80px #3b444b2b,inset 0 1px #fff;width:100%;max-width:560px;animation:pop .2s both}
.editor h2{font-size:22px;line-height:1.5}
.editor .desc{color:#7f8d96;font-size:14px;line-height:1.7;margin-top:4px}
.editor form{gap:16px;display:grid;margin-top:18px}
.editor label{color:#5e717c;flex-direction:column;gap:7px;font-size:14px;display:flex}
.editor input:not([type=checkbox]),.editor textarea,.editor select{color:#374e5b;background:linear-gradient(#fff,#f7f9f9);border:1px solid #d8e0e5;border-radius:12px;width:100%;padding:10px 12px;font-size:16px;box-shadow:inset 0 1px 2px #00000003;appearance:none}
.editor select{height:44px}
.editor input[type=color]{height:44px;padding:4px}
.form-grid{grid-template-columns:1fr 1fr;gap:14px;display:grid}
.editor fieldset{border:0;padding:0;margin:0}
.editor legend{color:#5e717c;margin-bottom:10px;font-size:14px;padding:0}
.day-picker{flex-wrap:wrap;gap:12px;display:flex}
.day-picker label{align-items:center;gap:7px;font-size:13px;flex-direction:row}
.day-picker .chk{width:23px;height:23px;border-radius:8px;--c:#149ac9}
.check-label{background:#fff8e7;border:1px solid #ede1bd;border-radius:15px;align-items:flex-start;padding:12px;line-height:1.6;flex-direction:row;gap:9px}
.check-label .chk{margin-top:3px;--c:#c8951f}
.check-label small{color:#8a7c59;font-size:12px;display:block;margin-top:3px}
.form-note{color:#87939a;font-size:12px;line-height:1.7}
.editor-actions{justify-content:flex-end;align-items:center;gap:9px;padding-top:10px;display:flex;flex-wrap:wrap}
.editor-actions .danger{margin-right:auto}
.holiday-editor{gap:14px;display:grid;margin-top:18px}
.holiday-row{grid-template-columns:150px minmax(0,1fr) 34px;align-items:center;gap:6px;display:grid}
.holiday-row input{padding:9px!important;font-size:14px!important}
.fee-row{grid-template-columns:140px 108px minmax(0,1fr) 34px;align-items:center;gap:6px;display:grid}
.fee-row input{padding:9px!important;font-size:14px!important}
button.stat{width:100%;display:block;font:inherit}
@media (max-width:640px){.fee-row{grid-template-columns:1fr 1fr 34px}.fee-row input:nth-child(3){grid-column:1/-1}}
.toast-wrap{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center;pointer-events:none}
.toast{background:var(--popover);color:#343434;border:1px solid var(--border);border-radius:14px;padding:11px 16px;font-size:13px;box-shadow:0 10px 28px #3b444b26;animation:rise .25s both;display:flex;align-items:center;gap:8px}
.toast.success{color:#177a45}
.toast.error{color:#b23b30}
.toast.info{color:#2a6c88}

"use strict";
/* Neils Class Planner — standalone offline build. Same data + design as the original,

/* ---------- constants ---------- */
const TZ = "Asia/Bangkok";
const DOW = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"]; // 0=Sun … 6=Sat
const DOW_ORDER = [1, 2, 3, 4, 5, 6, 0];            // Mon-first
const KEY = "neils-class-planner-v6";

/* real data recovered from the original planner */
/* real data — merged from the class progress tracker + the planner.

const RATE = 400;
const clone = value => JSON.parse(JSON.stringify(value));
function genId() { return globalThis.crypto?.randomUUID?.() || 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2); }
const cents = n => Math.round(Number(n) * 100) / 100;
function validDate(d) { return typeof d === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(d) && d >= '1900-01-01' && d <= '2199-12-31' && !isNaN(Date.parse(d + 'T12:00:00Z')) && new Date(d + 'T12:00:00Z').toISOString().slice(0,10) === d; }
function validTime(t) { return typeof t === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(t); }
function amountOf(e, d = data) { return cents(e.hours * (d.courses.find(c => c.id === e.courseId)?.rate || 0)); }
function allocated(e) { return cents(e.paidAmount || 0); }
function cashTotal(d = data) { return cents(d.payments.reduce((n,p) => n + p.amount, 0)); }
function unassigned(d = data) { return Math.max(0, cents(cashTotal(d) - d.events.reduce((n,e) => n + allocated(e), 0))); }
function reconcile(d, distribute = false) {
  let budget = cashTotal(d);
  const events = d.events.map(e => ({...e}));
  const order = [...events].sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time) || a.id.localeCompare(b.id));
  for (const e of order) {
    const val = amountOf(e,d);
    e.paidAmount = cents(Math.min(e.status === 'cancelled' ? 0 : allocated(e), val, budget));
    budget = cents(budget - e.paidAmount);
  }
  if (distribute) for (const e of order) {
    if (e.status !== 'done') continue;
    const extra = Math.min(budget, cents(amountOf(e,d) - allocated(e)));
    e.paidAmount = cents(allocated(e) + extra); budget = cents(budget - extra);

  for (const e of events) e.paid = amountOf(e,d) > 0 && allocated(e) >= amountOf(e,d);
  return {...d, events};
}

}
function validateData(input) {

    if(!e || !['planned','done','cancelled'].includes(e.status)) fail('invalid class status');
    const courseId = e.courseId || ''; if(courseId && !courses.some(c=>c.id === courseId)) fail('class refers to a missing course');

  });

const chkSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

/* ---------- date + logic helpers ---------- */
const todayStr = () => { const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(p=>[p.type,p.value])); return `${parts.year}-${parts.month}-${parts.day}`; };
const addDays = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
const dowOf = d => new Date(d + "T12:00:00Z").getUTCDay();
const t2m = t => { const [a, b] = t.split(":").map(Number); return a * 60 + b; };
const endTime = e => { const t = t2m(e.time) + e.hours * 60; return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };
const fmt = (d, o) => new Date(d + "T12:00:00Z").toLocaleDateString("en-US", {timeZone:"UTC", ...o}).toLowerCase();
const num = n => (+n).toFixed(2).replace(/\.?0+$/, "");
const money = n => "฿" + cents(n || 0).toLocaleString("en-US", {maximumFractionDigits:2});
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function clashSet(events) {
  const set = new Set();
  const a = events.filter(e => e.status !== "cancelled")
    .sort((x, y) => x.date.localeCompare(y.date) || x.time.localeCompare(y.time));
  for (let i = 0; i < a.length; i++) {
    for (let j = i + 1; j < a.length; j++) {
      if (a[j].date !== a[i].date) break;
      const s1 = t2m(a[i].time), e1 = s1 + a[i].hours * 60, s2 = t2m(a[j].time), e2 = s2 + a[j].hours * 60;
      if (s2 < e1 && s1 < e2) { set.add(a[i].id); set.add(a[j].id); }
    }
  }
  return set;
}
function genSessions(course, holidays, events) {
  let remaining = course.target - events.filter(e => e.courseId === course.id && e.status !== "cancelled").reduce((s, e) => s + e.hours, 0);
  if (!validDate(course.start) || !course.days.length || course.hours <= 0) throw new Error('invalid schedule settings');
  let i = course.start; const out = [];
  for (let k = 0; k < 50000 && remaining > 0.001; k++, i = addDays(i, 1)) {
    if (!course.days.includes(dowOf(i))) continue;
    if (holidays.some(h => h.date === i)) continue;
    if (events.some(e => e.courseId === course.id && e.date === i)) continue;
    const hours = Math.min(course.hours, remaining);
    if ([...events, ...out].some(e => e.status !== 'cancelled' && e.date === i && t2m(course.time) < t2m(e.time) + e.hours*60 && t2m(e.time) < t2m(course.time) + hours*60)) continue;
    out.push({ id: genId(), courseId: course.id, title: course.name, date: i, time: course.time, hours: Math.min(course.hours, remaining), status: "planned", paid: false, location: course.location, notes: "" });
    remaining = cents(remaining - hours);
  }
  if (remaining > .001) throw new Error('no available schedule within the supported range');
  return out;
}

/* ---------- state ---------- */
let storageRaw = null, storageIssue = '', storageBlocked = false;
let data = load();
let prev = null, history = [];
let cur = todayStr(), view = 'month', query = '', hidden = [];
let editEvent = null, editCourse = null, holidayOpen = false, holidayDraft = [], regen = false, confirmBox = null;
let feesOpen = false, feesDraft = [], distributeFees = true;
let showEnded = false, dragId = '', dropDay = '';
let restoreFocus = null;
function load() {
  try {
    storageRaw = localStorage.getItem(KEY);
    if(storageRaw != null) {
      try { return validateData(JSON.parse(storageRaw)); }
      catch(e) { storageIssue = 'saved data could not load. this is a baseline preview; export the original data before importing a valid backup.'; storageBlocked = true; }
    }
  } catch(e) { storageIssue = 'browser storage is unavailable. changes stay in this tab; download a backup before closing.'; }
  return validateData(clone(SEED));
}
function persist() {
  try { localStorage.setItem(KEY,JSON.stringify(data)); storageRaw = localStorage.getItem(KEY); storageIssue=''; }
  catch(e) { storageIssue='could not save to this browser. your changes are in this tab — download a backup before closing.'; }
}
function commit(next,msg,allowRecovery=false) {
  try { next=validateData(next); } catch(e) { toast(e.message,'error'); return false; }
  if(storageBlocked && !allowRecovery) { toast('import a valid backup first; original stored data is protected','error'); return false; }
  try { if(localStorage.getItem(KEY)!==storageRaw) { storageIssue='another tab changed this planner. back up this tab, then reload before making more changes.'; render(); toast(storageIssue,'error'); return false; } } catch(e) {}
  history.push(clone(data)); if(history.length>30) history.shift(); prev=history.at(-1);
  data=next; storageBlocked=false; persist(); render();
  scheduleSync();
  if(msg) toast(storageIssue ? 'updated in this tab — download a backup to keep it' : msg,storageIssue ? 'info' : 'success');
  return true;
}
function undo() {
  if(!history.length) return;
  const target=history.pop(), remaining=[...history];
  if(commit(target,'undone ↩️')) {history=remaining;prev=history.at(-1)||null;} else {history.push(target);prev=target;}
  render();
}
window.addEventListener('storage',e=> {if(e.key===KEY || e.key===null) {storageIssue='another tab changed this planner. download a backup of this tab, then reload to use the latest data.';render();}});

/* ---------- toast ---------- */
function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "toast " + (kind || "");
  el.textContent = msg;
  const wrap=document.getElementById("toasts"); wrap.appendChild(el); while(wrap.children.length>3) wrap.firstElementChild.remove();
  setTimeout(() => { el.style.transition = "opacity .3s"; el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }, 2600);
}

/* ---------- file helpers ---------- */
function download(name, text, mime) {
  const url = URL.createObjectURL(new Blob([text], { type: mime || "application/json" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportICS() {
  const escv = s => String(s || "").replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
  const stamp = dt => dt.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Neils//Class Planner//TH", "CALSCALE:GREGORIAN", "X-WR-CALNAME:Neils classes"];
  data.events.filter(e => e.status !== "cancelled").forEach(e => {
    const s = new Date(`${e.date}T${e.time}:00+07:00`);
    lines.push("BEGIN:VEVENT", "UID:" + e.id + "@neils-planner", "DTSTAMP:" + stamp(new Date()),
      "DTSTART:" + stamp(s), "DTEND:" + stamp(new Date(+s + e.hours * 36e5)),
      "SUMMARY:" + escv(e.title), "LOCATION:" + escv(e.location), "DESCRIPTION:" + escv(e.notes), "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  const folded = lines.map(l => { let out = "", ln = ""; for (const ch of l) { if (new TextEncoder().encode(ln + ch).length > 73) { out += ln + "\r\n"; ln = " "; } ln += ch; } return out + ln; }).join("\r\n") + "\r\n";
  download("neils-classes.ics", folded, "text/calendar;charset=utf-8");
  toast("exported ✨ import it into google / apple calendar", "success");
}
function importJSON(file) {
  if (file.size > 20*1024*1024) { toast("backup is too large (20 mb maximum)","error"); return; }
  const reader = new FileReader();
  reader.onerror = () => toast("could not read that file", "error");
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if(parsed.version != null && ![1,2].includes(parsed.version)) throw new Error('unsupported backup version');
      const d = validateData(parsed.data || parsed);
      askConfirm("replace your calendar with this backup?", `${d.courses.length} courses and ${d.events.length} classes · replaces current data; payment marks are limited to recorded cash. backup first if needed.`, () => { if(commit(d, "imported ✅", true)) {hidden=[];query="";render();} });
    } catch (e) { toast("backup not imported: " + e.message, "error"); }
  };
  reader.readAsText(file);
}

function chip(e, clashes, courseById) {

  return `<button class="event-chip ${esc(e.status)} ${clashes.has(e.id) ? "clash" : ""} ${missed ? "missed" : ""}" draggable="true" data-event="${esc(e.id)}" style="--c:${esc(c)}">

          <div class="calendar-footer"><span><i class="legend-dot"></i> hit ✓ inside a class to mark it taught</span><span>drag to reschedule, or edit the details 🤙</span></div>
        </section>
      </main>
    </div>
  </div>`;
  if (focusId === "search") { const input = document.getElementById("search"); input.focus(); input.setSelectionRange(...selection); }
  renderModals();
  paintSyncStatus();
}

        <p class="form-note">new schedule skips days off and time clashes · last session shrinks to hit the total exactly 👌</p>
        <div class="editor-actions">

      </div>
    </div></div>`;
  }
  if (confirmBox) {
    html += `<div class="overlay" data-close="confirm"><div class="editor" data-stop style="max-width:440px">
      <h2>${esc(confirmBox.title)}</h2><p class="desc">${esc(confirmBox.desc)}</p>

  const oldFocus=document.activeElement, oldId=oldFocus?.id, wasOpen=!!m.firstElementChild;

  const editors=[...m.querySelectorAll('.editor')];
  editors.forEach((el,i)=> {

    const close=document.createElement('button'); close.type='button'; close.className='bare close-editor'; close.dataset.dismiss=el.parentElement.dataset.close; close.disabled=close.dataset.dismiss==='sync'&&syncBusy; close.setAttribute('aria-label','close editor'); close.innerHTML=icon('x',20); el.prepend(close);

  if(html) {
    const top=editors.at(-1); editors.slice(0,-1).forEach(el=>el.inert=true);
    const restored=oldId && m.querySelector('#'+CSS.escape(oldId));
    if(restored && top.contains(restored)) restored.focus(); else top.focus();

}

/* ---------- editor helpers ---------- */
function newEvent(date) { editEvent = { id: genId(), courseId: "", title: "", date: date || cur, time: "18:30", hours: 2, status: "planned", paid: false, paidAmount: 0, location: "", notes: "" }; render(); }
function openEvent(e) { editEvent = clone(e); render(); }
function newCourse() { regen = false; editCourse = { id: genId(), name: "", color: "#28b7ef", start: cur, time: "18:30", hours: 2, target: 30, days: [1, 3], rate: RATE, location: "", notes: "" }; render(); }
function openCourse(c) { regen = false; editCourse = clone(c); render(); }
function askConfirm(title, desc, run) { confirmBox = { title, desc, run }; render(); }

function saveEvent() {
  const A = {...editEvent,title:editEvent.title.trim()};
  if (!A.title || !validDate(A.date) || !validTime(A.time) || !Number.isFinite(A.hours) || A.hours < .25 || A.hours>12 || A.hours*4%1) {toast('check the title, date, time and hours','error');return;}
  if (t2m(A.time) + A.hours * 60 > 1440) { toast("a class has to end on the same day 🌙", "error"); return; }
  const exists = data.events.some(e => e.id === A.id);
  const events = exists ? data.events.map(e => e.id === A.id ? A : e) : [...data.events, A];
  if(commit({ ...data, events }, "saved ✅")) {editEvent = null; render();}
}
function saveCourse() {
  const W = editCourse;
  if (!W.days.length) { toast("pick at least one class day 📅", "error"); return; }
  if (t2m(W.time) + W.hours * 60 > 1440) { toast("a class has to end on the same day 🌙", "error"); return; }
  const isExisting = data.courses.some(c => c.id === W.id);
  let events = data.events;
  if (!isExisting || regen) {
    const kept = data.events.filter(e => e.courseId !== W.id || e.status !== "planned" || allocated(e)>0);
    events = [...kept, ...genSessions(W, data.holidays, kept)];
  }
  const courses = isExisting ? data.courses.map(c => c.id === W.id ? W : c) : [...data.courses, W];
  if(commit({ ...data, courses, events }, "course saved ✅")) {editCourse = null; regen = false; render();}
}
function fillMissing(course) {
  const evs = data.events.filter(e => e.courseId === course.id && e.status !== "cancelled");
  const last = evs.map(e => e.date).sort().at(-1);
  const start = [last && last >= course.start ? addDays(last, 1) : course.start, todayStr()].sort().at(-1);
  const extra = genSessions({ ...course, start }, data.holidays, data.events);
  if (!extra.length) { toast("you're all scheduled already 👌", "info"); return; }
  commit({ ...data, events: [...data.events, ...extra] }, "all hours scheduled 🎉");
}

/* ---------- interactions (event delegation) ---------- */
function nav(delta) {
  if (view === "week") { cur = addDays(cur, delta * 7); render(); return; }
  const d = new Date(cur.slice(0, 7) + "-01T12:00Z"); d.setUTCMonth(d.getUTCMonth() + delta); cur = d.toISOString().slice(0, 10); render();
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-dismiss],[data-add],[data-course],[data-toggle],[data-fill],[data-event],[data-view],[data-cday],[data-hdel],[data-holiday],[data-paid],[data-taught],[data-fees],[data-pdel],[data-close],[id]");
  if (!t) return;
  const id = t.id, ds = t.dataset;
  if(editEvent && document.getElementById('eventForm')) syncEvent();
  if(editCourse && document.getElementById('courseForm')) syncCourse();
  if(ds.dismiss !== undefined) {dismiss(ds.dismiss);return; }
  if (ds.paid !== undefined) { const e=clone(data.events.find(x=>x.id===ds.paid)); if(e && toggleAllocation(e)) commit({...data,events:data.events.map(x=>x.id===e.id?e:x)},'class payment updated'); return; }
  if (ds.taught !== undefined) { const e = data.events.find(x => x.id === ds.taught); if (e) { const ns = e.status === "done" ? "planned" : "done"; commit({ ...data, events: data.events.map(x => x.id === ds.taught ? { ...x, status: ns } : x) }, ns === "done" ? "marked taught ✅" : "back to planned"); } return; }
  if (ds.holiday !== undefined) { holidayDraft = clone(data.holidays); holidayOpen = true; return render(); }
  if (ds.fees !== undefined) { feesDraft = clone(data.payments || []); feesOpen = true; return render(); }
  if (ds.pdel !== undefined) { feesDraft = feesDraft.filter((_, i) => i !== +ds.pdel); return render(); }
  if (ds.add !== undefined) return newEvent(ds.add);
  if (ds.course !== undefined) return openCourse(data.courses.find(c => c.id === ds.course));
  if (ds.toggle !== undefined) { hidden = hidden.includes(ds.toggle) ? hidden.filter(x => x !== ds.toggle) : [...hidden, ds.toggle]; return render(); }
  if (ds.fill !== undefined) {try {fillMissing(data.courses.find(c => c.id === ds.fill));} catch(e){toast(e.message,"error");}return;}
  if (ds.event !== undefined) return openEvent(data.events.find(e => e.id === ds.event));
  if (ds.view) { view = ds.view; return render(); }
  if (ds.cday !== undefined) { const d = +ds.cday; editCourse.days = editCourse.days.includes(d) ? editCourse.days.filter(x => x !== d) : [...editCourse.days, d]; return render(); }
  if (ds.hdel !== undefined) { holidayDraft = holidayDraft.filter((_, i) => i !== +ds.hdel); return render(); }
  if (ds.close !== undefined && ev.target === t) {dismiss(ds.close);return;}

  switch (id) {
    case "undo": return undo();
    case "export": return download("neils-planner-backup-"+todayStr()+".json", JSON.stringify({ version: 2, data }, null, 2));
    case "rawbackup": return download("neils-original-saved-data.json",storageRaw || "{}");
    case "import": return document.getElementById("file").click();
    case "addcourse": case "addcourse2": return newCourse();
    case "toggleEnded": showEnded = !showEnded; return render();
    case "holidays": holidayDraft = clone(data.holidays); holidayOpen = true; return render();
    case "fees": feesDraft = clone(data.payments || []); feesOpen = true; return render();
    case "p-add": feesDraft = [...feesDraft, { id: genId(), date: todayStr(), amount: 8000, note: "biweekly transfer" }]; return render();
    case "p-save": {
      try {
        const clean=feesDraft.map(p=>({...p,amount:Number(p.amount),note:p.note.trim()}));
        if(clean.some(p=>!validDate(p.date) || p.date>todayStr() || !Number.isFinite(p.amount) || p.amount<=0 || p.amount>1e8 || Math.abs(p.amount*100-Math.round(p.amount*100))>.00001)) throw new Error('use valid received dates (today or earlier) and positive amounts with up to 2 decimal places');
        const next=reconcile({...data,payments:clean},distributeFees);
        if(commit(next,'fees saved 💰')) {feesOpen=false;render();}
      }catch(e){toast(e.message,'error');} return;
    }
    case "ics": return exportICS();
    case "print": return window.print();
    case "today": cur = todayStr(); return render();
    case "prev": return nav(-1);
    case "next": return nav(1);
    case "clearsearch": query = ""; render(); document.getElementById("search").focus(); return;
    case "ev-del": { const A = editEvent; return askConfirm("delete this class? 🗑️", "removes just this session · the course's remaining hours go back up, hit 'fill the gap' to reschedule", () => { if(!commit({ ...data, events: data.events.filter(e => e.id !== A.id) }, "deleted 🗑️")) return; editEvent = null; confirmBox = null; render(); }); }
    case "ev-dup": syncEvent(); if(!validDate(editEvent.date) || editEvent.date >= "2199-12-31") {toast("choose a valid date before duplicating", "error");return;} editEvent = { ...editEvent, id: genId(), date: addDays(editEvent.date, 1), status: "planned", paid:false, paidAmount:0 }; return render();
    case "c-del": { const W = editCourse; return askConfirm("delete " + W.name + "? 🗑️", "the course and every session in it get deleted, taught history included", () => { if(!commit({ ...data, courses: data.courses.filter(c => c.id !== W.id), events: data.events.filter(e => e.courseId !== W.id) }, "course deleted 🗑️")) return; editCourse = null; confirmBox = null; render(); }); }
    case "c-dup": syncCourse(); editCourse = { ...editCourse, id: genId(), name: editCourse.name + " (copy)" }; regen = false; return render();
    case "ev-paid": syncEvent(); toggleAllocation(editEvent); return render();
    case "c-regen": regen = !regen; return render();
    case "h-add": holidayDraft = [...holidayDraft, { id:genId(), date: cur, name: "" }]; return render();
    case "h-save": {
      const clean=holidayDraft.map(h=>({id:h.id||genId(),date:h.date,name:h.name.trim()}));
      if(clean.some(h=>!validDate(h.date)||!h.name)) {toast('each day off needs a valid date and name','error');return;}
      if(commit({...data,holidays:clean},'days off saved ✅')) {holidayOpen=false;render();} return;
    }
    case "cf-no": confirmBox = null; return render();
    case "cf-yes": { const run = confirmBox.run; confirmBox = null; return run(); }
  }
});

/* keep editor state synced from inputs before actions that re-render */
function syncEvent() {
  if (!editEvent) return; const g = id => document.getElementById(id);
  editEvent = { ...editEvent, title: g("ev-title").value, courseId: g("ev-course").value === "none" ? "" : g("ev-course").value, date: g("ev-date").value, time: g("ev-time").value, hours: +g("ev-hours").value, status: g("ev-status").value, location: g("ev-loc").value, notes: g("ev-notes").value };
}
function syncCourse() {
  if (!editCourse) return; const g = id => document.getElementById(id);
  editCourse = { ...editCourse, name: g("c-name").value, start: g("c-start").value, time: g("c-time").value, target: +g("c-target").value, hours: +g("c-hours").value, rate: +g("c-rate").value, color: g("c-color").value, location: g("c-loc").value, notes: g("c-notes").value };
}
document.addEventListener("input", ev => {
  const id = ev.target.id, ds = ev.target.dataset;
  if (id === "search") { query = ev.target.value; return render(); }
  if(id.startsWith("ev-") && id!=="ev-paid") syncEvent();
  if(id.startsWith("c-")) syncCourse();
  if(id === "p-distribute") distributeFees=ev.target.checked;
  if (id === "jump" && ev.target.value) { cur = ev.target.value; return render(); }
  if (ds.hdate !== undefined) holidayDraft[+ds.hdate].date = ev.target.value;
  if (ds.hname !== undefined) holidayDraft[+ds.hname].name = ev.target.value;
  if (ds.pdate !== undefined) feesDraft[+ds.pdate].date = ev.target.value;
  if (ds.pamt !== undefined) feesDraft[+ds.pamt].amount = ev.target.value;
  if (ds.pnote !== undefined) feesDraft[+ds.pnote].note = ev.target.value;
  if (ds.pamt !== undefined || ds.pdate !== undefined) {
    const total=feesDraft.reduce((s,p)=>s+(Number(p.amount)||0),0), dates=feesDraft.map(p=>p.date).filter(validDate).sort();
    document.getElementById('fee-summary').textContent='total logged: '+money(total)+(dates.length ? ' · estimated next fee '+fmt(addDays(dates.at(-1),14),{day:'numeric',month:'short'}) : '');
  }
});
document.addEventListener("change", ev => {
  if (ev.target.closest('#eventForm')) syncEvent();
  if (ev.target.closest('#courseForm')) syncCourse();
  if (ev.target.id === "ev-course" && editEvent) {
    const course=data.courses.find(c=>c.id===editEvent.courseId), old=data.events.find(e=>e.id===editEvent.id);
    if(course && (!old || old.courseId!==course.id)) {
      editEvent.title=course.name;editEvent.time=course.time;editEvent.hours=course.hours;editEvent.location=course.location;
      if(!old || old.courseId!==course.id) {editEvent.paid=false;editEvent.paidAmount=0;}
    }
    render();
  }
  if (ev.target.id === "file") { const f = ev.target.files?.[0]; if (f) importJSON(f); ev.target.value = ""; }
});
document.addEventListener("submit", ev => {
  ev.preventDefault();
  if (ev.target.id === "eventForm") { syncEvent(); saveEvent(); }
  if (ev.target.id === "courseForm") {
    syncCourse();
    if (!editCourse.name.trim()) { toast("gotta name the course first 🏷️", "error"); return; }
    try {validateData({...data,courses:[...data.courses.filter(c=>c.id!==editCourse.id),editCourse]});saveCourse();} catch(e) {toast(e.message,"error");}
  }
});
function dismiss(kind) {
  if(kind==='sync'){if(syncBusy)return;syncOpen=false;render();scheduleSync();return;}
  if(kind==='confirm') confirmBox=null;
  else if(kind==='event') editEvent=null;
  else if(kind==='course') editCourse=null;
  else if(kind==='fees') feesOpen=false;
  else if(kind==='holiday') holidayOpen=false;
  render();
}
document.addEventListener('keydown',ev=> {
  const top=document.querySelector('#modals .overlay:last-child');
  if(ev.key==='Escape' && top) {ev.preventDefault();dismiss(top.dataset.close);}
  if(ev.key==='Tab' && top) {
    const els=[...top.querySelectorAll('button,input,textarea,select,[tabindex="0"]')].filter(e=>!e.disabled && !e.hidden);
    if(!els.length) return;
    if(ev.shiftKey && (document.activeElement===els[0] || !els.includes(document.activeElement))) {ev.preventDefault();els.at(-1).focus();}
    else if(!ev.shiftKey && (document.activeElement===els.at(-1) || !els.includes(document.activeElement))) {ev.preventDefault();els[0].focus();}
  }
});
/* Keep the drag source alive until drop. */
function clearDrop() {document.querySelectorAll('.can-drop').forEach(el=>el.classList.remove('can-drop'));}
document.addEventListener('dragstart',ev=> {
  const chip=ev.target.closest('[data-event]'); if(!chip || !ev.dataTransfer) return;
  dragId=chip.dataset.event;ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',dragId);
});
document.addEventListener('dragend',()=>{dragId='';dropDay='';clearDrop();});
document.addEventListener('dragover',ev=>{
  const day=ev.target.closest('[data-day]');if(!day || !dragId)return;
  ev.preventDefault();ev.dataTransfer.dropEffect='move';
  if(dropDay!==day.dataset.day){clearDrop();dropDay=day.dataset.day;day.classList.add('can-drop');}
});
document.addEventListener('drop',ev=> {
  const day=ev.target.closest('[data-day]');if(!day || !dragId)return;ev.preventDefault();
  const source=ev.dataTransfer.getData('text/plain'),target=day.dataset.day;
  const e=data.events.find(e=>e.id===source);dragId='';dropDay='';clearDrop();
  if(e && e.date!==target) commit({...data,events:data.events.map(x=>x.id===source?{...x,date:target}:x)},'class moved 📆');
});




const APPS_SCRIPT_SOURCE="/**\n * class planner ↔ google sheets\n * Bound script: paste into Code.gs in a blank Google Sheet.\n * Add Services > Google Sheets API, then run setupPlannerSync_.\n * Deploy as a web app: Execute as Me; Who has access: Anyone.\n * The spreadsheet itself stays private. Every data request needs the sync key.\n */\nconst PLANNER_TABS_={\n  courses:['id','name','color','start','time','hours','target','days','rate','location','notes'],\n  sessions:['id','course_id','title','date','time','hours','status','paid_amount','location','notes'],\n  payments:['id','date','amount','note'],\n  days_off:['id','date','name']\n};\nfunction setupPlannerSync_(){\n  if(typeof Sheets==='undefined')throw new Error('First add Services (+) > Google Sheets API in the Apps Script editor.');\n  const ss=SpreadsheetApp.getActiveSpreadsheet();if(!ss)throw new Error('Open this script through Extensions > Apps Script in your Google Sheet.');\n  ss.setSpreadsheetTimeZone('Asia/Bangkok');\n  const props=PropertiesService.getScriptProperties();\n  Object.keys(PLANNER_TABS_).forEach(name=>{const sheet=ss.getSheetByName(name);if(sheet&&sheet.getLastRow()>0){const got=sheet.getRange(1,1,1,PLANNER_TABS_[name].length).getDisplayValues()[0];if(JSON.stringify(got)!==JSON.stringify(PLANNER_TABS_[name]))throw new Error('Tab '+name+' already has different headers. Use a blank sheet or rename that unrelated tab first.');}});\n  Object.keys(PLANNER_TABS_).forEach(name=>{\n    const headers=PLANNER_TABS_[name],sheet=ss.getSheetByName(name)||ss.insertSheet(name);\n    if(!sheet.getLastRow())sheet.getRange(1,1,1,headers.length).setValues([headers]);\n    sheet.setFrozenRows(1);sheet.getRange(1,1,sheet.getMaxRows(),headers.length).setNumberFormat('@');\n    sheet.getRange(1,1,1,headers.length).setBackground('#e3ebf7').setFontColor('#345b96').setFontWeight('bold');\n    sheet.autoResizeColumns(1,headers.length);\n    ['name','title','note','notes','location'].forEach(h=>{if(headers.includes(h))sheet.setColumnWidth(headers.indexOf(h)+1,210);});\n    if(name==='sessions')sheet.getRange(2,7,sheet.getMaxRows()-1,1).setDataValidation(SpreadsheetApp.newDataValidation().requireValueInList(['planned','done','cancelled'],true).setAllowInvalid(false).build());\n    const notice='Planner-managed tab: keep the header row and existing ids. New rows need a unique id. Dates: YYYY-MM-DD. Times: HH:mm. Use plain values; put formulas in another tab. Finish edits before syncing.';\n    sheet.getRange('A1').setNote(notice);\n  });\n  props.setProperty('PLANNER_SHEET_ID',ss.getId());\n  if(!props.getProperty('PLANNER_SYNC_KEY'))props.setProperty('PLANNER_SYNC_KEY',Utilities.getUuid().replace(/-/g,'')+Utilities.getUuid().replace(/-/g,''));\n  showPlannerSyncKey_();\n}\nfunction onOpen(){SpreadsheetApp.getUi().createMenu('planner sync').addItem('show private sync key','showPlannerSyncKey_').addItem('set up planner tabs','setupPlannerSync_').addItem('rotate private sync key','rotatePlannerSyncKey_').addToUi();}\nfunction showPlannerSyncKey_(){\n  const key=PropertiesService.getScriptProperties().getProperty('PLANNER_SYNC_KEY');if(!key)throw new Error('Run setupPlannerSync_ first.');\n  SpreadsheetApp.getUi().showModalDialog(HtmlService.createHtmlOutput('<div style=\"font:15px system-ui;padding:16px\"><h2>your private sync key</h2><p>Copy this into the planner with your deployed /exec URL. Keep it private.</p><textarea readonly style=\"width:100%;height:90px;font:15px monospace\">'+key+'</textarea><p>Next: Deploy → New deployment → Web app. Execute as Me; access Anyone.</p></div>').setWidth(490).setHeight(290),'planner sync setup');\n}\nfunction rotatePlannerSyncKey_(){\n  const ui=SpreadsheetApp.getUi();if(ui.alert('rotate sync key?','Connected devices will need the new key.',ui.ButtonSet.YES_NO)!==ui.Button.YES)return;\n  PropertiesService.getScriptProperties().setProperty('PLANNER_SYNC_KEY',Utilities.getUuid().replace(/-/g,'')+Utilities.getUuid().replace(/-/g,''));showPlannerSyncKey_();\n}\nfunction doGet(e){\n  const channel=String(e&&e.parameter&&e.parameter.channel||'');\n  if(!e||e.parameter.bridge!=='1'||!/^[A-Za-z0-9-]{20,180}$/.test(channel))return HtmlService.createHtmlOutput('<p>planner sync connection v2 is ready. Connect from your class-planner.html using this /exec URL and your private key.</p>');\n  const html='<!doctype html><html><head><meta name=\"referrer\" content=\"no-referrer\"></head><body><script>'+bridgeScript_(channel)+'<\/script></body></html>';\n  return HtmlService.createHtmlOutput(html).setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);\n}\nfunction bridgeScript_(channel){\n  return `\"use strict\";const channel=${JSON.stringify(channel)};\n  const ancestors=[];let ancestor=window.parent;\n  for(let i=0;i<20&&ancestor&&ancestor!==window;i++){\n    ancestors.push(ancestor);let next;try{next=ancestor.parent;}catch(e){break;}if(next===ancestor)break;ancestor=next;\n  }\n  let client=null,clientOrigin=null;\n  window.addEventListener('message',function(e){\n    const m=e.data;if(!ancestors.includes(e.source)||!m||m.channel!==channel||m.type!=='planner-request'||typeof m.id!=='string')return;\n    if(client&&(e.source!==client||e.origin!==clientOrigin))return;client=e.source;clientOrigin=e.origin;\n    const reply=function(result,error){client.postMessage({channel:channel,type:'planner-response',id:m.id,result:result||null,error:error||null},clientOrigin==='null'?'*':clientOrigin);};\n    google.script.run.withSuccessHandler(function(r){reply(r,null);}).withFailureHandler(function(err){reply(null,err.message||'apps script error');}).plannerRpc(m.payload);\n  });\n  ancestors.forEach(function(parent){parent.postMessage({channel:channel,type:'planner-ready'},'*');});`;\n}\nfunction doPost(e){\n  let result;\n  try{\n    const body=e&&e.postData&&e.postData.contents;\n    if(typeof body!=='string'||body.length>5100000)throw new Error('invalid request body');\n    result=plannerRpc(JSON.parse(body));\n  }catch(error){result={ok:false,code:'ERROR',error:String(error.message||error)};}\n  return ContentService.createTextOutput(JSON.stringify(result)).setMimeType(ContentService.MimeType.JSON);\n}\nfunction plannerRpc(request){\n  try{\n    if(!request||request.protocol!==1||!['read','write'].includes(request.action))throw new Error('unsupported planner sync request');\n    const props=PropertiesService.getScriptProperties(),expected=props.getProperty('PLANNER_SYNC_KEY');\n    if(!expected||typeof request.key!=='string'||request.key.length>200||!sameSecret_(expected,request.key))throw new Error('invalid private sync key — copy it from the planner sync menu in your sheet');\n    const sheetId=props.getProperty('PLANNER_SHEET_ID');if(!sheetId)throw new Error('run setupPlannerSync_ in the Apps Script editor first');\n    const lock=LockService.getScriptLock();if(!lock.tryLock(20000))throw new Error('another sync is running. try again in a moment.');\n    try{\n      const ss=SpreadsheetApp.openById(sheetId),current=readPlanner_(ss);\n      if(request.action==='write'){\n        if(typeof request.revision!=='string'||request.revision!==current.revision)return {ok:false,code:'CONFLICT',error:'sheets changed since this sync started. compare again before writing.'};\n        if(JSON.stringify(request.data).length>5000000)throw new Error('planner data is too large (5 mb limit)');\n        const next=normalizePlanner_(request.data);\n        // Recheck immediately before the atomic batch, including direct cell edits.\n        if(readPlanner_(ss).revision!==current.revision)return {ok:false,code:'CONFLICT',error:'sheets changed during sync. try again.'};\n        writePlanner_(ss,next);\n      }\n      const result=request.action==='write'?readPlanner_(ss):current;\n      return {ok:true,protocol:1,sheetId:sheetId,revision:result.revision,data:result.data,needsNormalization:result.needsNormalization};\n    }finally{lock.releaseLock();}\n  }catch(error){return {ok:false,code:'ERROR',error:String(error.message||error)};}\n}\nfunction sameSecret_(a,b){const x=Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,a),y=Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,b);let difference=0;for(let i=0;i<x.length;i++)difference|=x[i]^y[i];return difference===0;}\nfunction digestPlanner_(value){return Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256,JSON.stringify(value)).map(n=>(n+256).toString(16).slice(-2)).join('');}\nfunction readPlanner_(ss){\n  const raw={},records={};\n  Object.keys(PLANNER_TABS_).forEach(name=>{\n    const sheet=ss.getSheetByName(name),headers=PLANNER_TABS_[name];if(!sheet)throw new Error('missing tab: '+name+'. run setupPlannerSync_ to restore the tab.');\n    if(sheet.getLastRow()>20001)throw new Error(name+' exceeds the 20,000-row limit');\n    const range=sheet.getRange(1,1,Math.max(1,sheet.getLastRow()),headers.length),values=range.getValues();\n    if(range.getFormulas().some(row=>row.some(Boolean)))throw new Error('use plain values in '+name+'; put formulas in a separate tab');\n    if(JSON.stringify(values[0])!==JSON.stringify(headers))throw new Error('headers changed in '+name+'. restore the original header names and order.');\n    const formatted=values.map(row=>row.map((value,i)=>value instanceof Date?Utilities.formatDate(value,'Asia/Bangkok',headers[i]==='time'?'HH:mm':'yyyy-MM-dd'):value));\n    raw[name]=formatted;\n    records[name]=formatted.slice(1).map((row,index)=>({row,index})).filter(x=>x.row.some(v=>v!==''&&v!==null)).map(x=>{\n      const obj=Object.fromEntries(headers.map((h,i)=>[h,x.row[i]??'']));\n      if(!String(obj.id).trim())throw new Error(name+' row '+(x.index+2)+' needs a unique id in column A');\n      obj.id=String(obj.id).trim();return obj;\n    });\n  });\n  const text=v=>String(v??''),num=(v,label)=>{if(v===''||v===null||typeof v==='boolean'||!Number.isFinite(Number(v)))throw new Error('invalid number: '+label);return Number(v);};\n  const dayNames=['sun','mon','tue','wed','thu','fri','sat'];\n  const courseRows=records.courses.map(r=>({id:r.id,name:text(r.name),color:text(r.color),start:text(r.start).trim(),time:text(r.time).trim(),hours:num(r.hours,'course hours'),target:num(r.target,'target'),days:text(r.days).split(/[,;\\s]+/).filter(Boolean).map(v=>/^\\d$/.test(v)?Number(v):dayNames.indexOf(v.toLowerCase().slice(0,3))),rate:r.rate===''?0:num(r.rate,'rate'),location:text(r.location),notes:text(r.notes)}));\n  const events=records.sessions.map(r=>({id:r.id,courseId:text(r.course_id).trim(),title:text(r.title),date:text(r.date).trim(),time:text(r.time).trim(),hours:num(r.hours,'session hours'),status:text(r.status).trim().toLowerCase(),paidAmount:r.paid_amount===''?0:num(r.paid_amount,'paid amount'),location:text(r.location),notes:text(r.notes)}));\n  const input={courses:courseRows,events,payments:records.payments.map(r=>({id:r.id,date:text(r.date).trim(),amount:num(r.amount,'payment amount'),note:text(r.note)})),holidays:records.days_off.map(r=>({id:r.id,date:text(r.date).trim(),name:text(r.name)}))};\n  const data=normalizePlanner_(input);\n  const needsNormalization=data.events.some((e,i)=>e.paidAmount!==events[i].paidAmount);\n  return {data,revision:digestPlanner_(raw),needsNormalization};\n}\nfunction plannerTables_(d){\n  return {\n    courses:d.courses.map(c=>[c.id,c.name,c.color,c.start,c.time,c.hours,c.target,c.days.map(day=>['sun','mon','tue','wed','thu','fri','sat'][day]).join(','),c.rate,c.location,c.notes]),\n    sessions:d.events.map(e=>[e.id,e.courseId,e.title,e.date,e.time,e.hours,e.status,e.paidAmount||0,e.location,e.notes]),\n    payments:d.payments.map(p=>[p.id,p.date,p.amount,p.note]),\n    days_off:d.holidays.map(h=>[h.id,h.date,h.name])\n  };\n}\nfunction writePlanner_(ss,data){\n  if(typeof Sheets==='undefined')throw new Error('add Services (+) > Google Sheets API in the script editor, then redeploy');\n  const tables=plannerTables_(data),requests=[];\n  Object.keys(PLANNER_TABS_).forEach(name=>{\n    const sheet=ss.getSheetByName(name),matrix=[PLANNER_TABS_[name],...tables[name]],rows=Math.max(sheet.getLastRow(),matrix.length),cols=PLANNER_TABS_[name].length;\n    if(rows>sheet.getMaxRows())requests.push({appendDimension:{sheetId:sheet.getSheetId(),dimension:'ROWS',length:rows-sheet.getMaxRows()}});\n    const cell=value=>({userEnteredValue:typeof value==='number'?{numberValue:value}:{stringValue:String(value??'')}});\n    requests.push({updateCells:{range:{sheetId:sheet.getSheetId(),startRowIndex:0,endRowIndex:rows,startColumnIndex:0,endColumnIndex:cols},rows:matrix.map(row=>({values:row.map(cell)})),fields:'userEnteredValue'}});\n  });\n  Sheets.Spreadsheets.batchUpdate({requests},ss.getId());\n  SpreadsheetApp.flush();\n}\n/* Shared validation + payment reconciliation, matching the HTML app. */\nfunction normalizePlanner_(source){\nconst cents = n => Math.round(Number(n) * 100) / 100;\nfunction validDate(d) { return typeof d === 'string' && /^\\d{4}-\\d{2}-\\d{2}$/.test(d) && d >= '1900-01-01' && d <= '2199-12-31' && !isNaN(Date.parse(d + 'T12:00:00Z')) && new Date(d + 'T12:00:00Z').toISOString().slice(0,10) === d; }\nfunction validTime(t) { return typeof t === 'string' && /^([01]\\d|2[0-3]):[0-5]\\d$/.test(t); }\nfunction amountOf(e, d) { return cents(e.hours * (d.courses.find(c => c.id === e.courseId)?.rate || 0)); }\nfunction allocated(e) { return cents(e.paidAmount || 0); }\nfunction cashTotal(d) { return cents(d.payments.reduce((n,p) => n + p.amount, 0)); }\nfunction reconcile(d, distribute = false) {\n  let budget = cashTotal(d);\n  const events = d.events.map(e => ({...e}));\n  const order = [...events].sort((a,b) => a.date.localeCompare(b.date) || a.time.localeCompare(b.time) || a.id.localeCompare(b.id));\n  for (const e of order) {\n    const val = amountOf(e,d);\n    e.paidAmount = cents(Math.min(e.status === 'cancelled' ? 0 : allocated(e), val, budget));\n    budget = cents(budget - e.paidAmount);\n  }\n  if (distribute) for (const e of order) {\n    if (e.status !== 'done') continue;\n    const extra = Math.min(budget, cents(amountOf(e,d) - allocated(e)));\n    e.paidAmount = cents(allocated(e) + extra); budget = cents(budget - extra);\n  }\n  for (const e of events) e.paid = amountOf(e,d) > 0 && allocated(e) >= amountOf(e,d);\n  return {...d, events};\n}\n\nconst t2m=t=>{const [h,m]=t.split(\":\").map(Number);return h*60+m;};\nfunction validateData(input) {\n  const fail = message => { throw new Error(message); };\n  if (!input || typeof input !== 'object' || !Array.isArray(input.courses) || !Array.isArray(input.events)) fail('courses and classes are required');\n  if (input.courses.length > 500 || input.events.length > 20000) fail('this backup is too large');\n  const str = (v, label, max=5000, required=false) => { if (v == null && !required) return ''; if(typeof v !== 'string' || v.length > max || (required && !v.trim())) fail('invalid ' + label); return v; };\n  const id = v => str(v,'id',200,true);\n  const number = (v,min,max,label,quarter=false) => { if(typeof v !== 'number' || !Number.isFinite(v) || v < min || v > max || (quarter && Math.abs(v*4-Math.round(v*4))>1e-7)) fail('invalid ' + label); return v; };\n  const date = v => validDate(v) ? v : fail('invalid date');\n  const time = v => validTime(v) ? v : fail('invalid time');\n  const courses = input.courses.map(c => {\n    if (!c || !Array.isArray(c.days) || !c.days.length || c.days.some(d=>!Number.isInteger(d)||d<0||d>6)) fail('choose valid course days');\n    const out = {id:id(c.id),name:str(c.name,'course name',150,true), color:/^#[0-9a-f]{6}$/i.test(c.color) ? c.color : '#3b82f6',start:date(c.start),time:time(c.time),hours:number(c.hours,.25,12,'session hours',true),target:number(c.target,.25,1000,'target hours',true),days:[...new Set(c.days)],rate:number(c.rate ?? 0,0,1000000,'rate'),location:str(c.location,'location',300),notes:str(c.notes,'notes')};\n    if(t2m(out.time)+out.hours*60>1440) fail('classes must end on the same day');\n    return out;\n  });\n  if(new Set(courses.map(c=>c.id)).size !== courses.length) fail('duplicate course ids');\n  const events = input.events.map(e => {\n    if(!e || !['planned','done','cancelled'].includes(e.status)) fail('invalid class status');\n    const courseId = e.courseId || ''; if(courseId && !courses.some(c=>c.id === courseId)) fail('class refers to a missing course');\n    const out = {id:id(e.id),courseId,title:str(e.title,'class title',150,true),date:date(e.date),time:time(e.time),hours:number(e.hours,.25,12,'class hours',true),status:e.status,location:str(e.location,'location',300),notes:str(e.notes,'notes'),paid:false};\n    if(t2m(out.time)+out.hours*60>1440) fail('classes must end on the same day');\n    if(e.paid != null && typeof e.paid !== 'boolean') fail('invalid paid flag');\n    out.paidAmount = e.paidAmount == null ? (e.paid ? amountOf(out,{courses}) : 0) : cents(number(e.paidAmount,0,12000000,'allocated amount'));\n    return out;\n  });\n  if(new Set(events.map(e=>e.id)).size !== events.length) fail('duplicate class ids');\n  if(input.holidays != null && !Array.isArray(input.holidays)) fail('invalid days off');\n  const holidays=(input.holidays || []).map((h,i)=>({id:id(h.id || 'holiday-'+h.date+'-'+i),date:date(h.date),name:str(h.name,'day off name',300,true)}));\n  if(new Set(holidays.map(h=>h.id)).size!==holidays.length) fail('duplicate day off ids');\n  if(input.payments != null && !Array.isArray(input.payments)) fail('invalid payments');\n  const payments=(input.payments || []).map(p=>({id:id(p.id),date:date(p.date),amount:cents(number(p.amount,.01,100000000,'payment amount')),note:str(p.note,'payment note',1000)}));\n  if(new Set(payments.map(p=>p.id)).size !== payments.length) fail('duplicate payment ids');\n  return reconcile({schemaVersion:2,courses,events,holidays,payments});\n}\nreturn validateData(source);\n}\n";

const SYNC_KEY='neils-planner-sheets-v1';
