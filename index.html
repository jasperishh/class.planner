  let resolveReady,rejectReady,settled=false;
  bridge.ready=new Promise((resolve,reject)=>{resolveReady=resolve;rejectReady=reject;});
  const timer=setTimeout(()=>{if(!settled){settled=true;rejectReady(new Error('connection timed out. check the /exec url and deploy access: anyone.'));destroySyncBridge();}},12000);
  function receive(ev){
    const m=ev.data;
    if(!m||m.channel!==nonce||!/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(ev.origin)&&ev.origin!=='https://script.google.com')return;
    if(m.type==='planner-ready'&&!bridge.peer){bridge.peer=ev.source;bridge.origin=ev.origin;settled=true;clearTimeout(timer);resolveReady(bridge);return;}
    if(ev.source!==bridge.peer||ev.origin!==bridge.origin||m.type!=='planner-response')return;
    const task=pending.get(m.id);if(!task)return;pending.delete(m.id);clearTimeout(task.timer);
    if(m.error)task.reject(new Error(m.error));else task.resolve(m.result);
  }
  window.addEventListener('message',receive);
  bridge.request=(payload)=>new Promise((resolve,reject)=>{
    const id=genId();const timer=setTimeout(()=>{pending.delete(id);reject(new Error('sync response timed out. local changes are safe; retry sync to check whether sheets received them.'));},45000);
    pending.set(id,{resolve,reject,timer});bridge.peer.postMessage({channel:nonce,type:'planner-request',id,payload},bridge.origin);
  });
  bridge.dispose=()=>{clearTimeout(timer);window.removeEventListener('message',receive);iframe.remove();if(!settled){settled=true;rejectReady(new Error('connection closed'));}for(const task of pending.values()){clearTimeout(task.timer);task.reject(new Error('connection closed'));}pending.clear();};
  syncBridge=bridge;iframe.src=syncConfig.url+'?bridge=1&channel='+encodeURIComponent(nonce);document.body.appendChild(iframe);return bridge.ready;
}
async function directSyncRequest(payload){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),35000);
  try{
    const response=await fetch(syncConfig.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow',credentials:'omit',referrerPolicy:'no-referrer',signal:controller.signal});
    if(!response.ok)throw new Error('google returned HTTP '+response.status+'. check deployment access and authorization.');
    const body=await response.text();
    try{return JSON.parse(body);}catch(e){throw new Error('google returned a web page instead of sync data. replace Code.gs with the connection v2 script, deploy a new version, and check access is Anyone.');}
  }catch(e){
    if(e.name==='AbortError')throw new Error(payload.action==='write'?'upload response timed out. local data is safe; sync again to check whether sheets received it.':'google did not respond. check the deployed /exec URL, access Anyone, and your internet connection.');
    if(e instanceof TypeError)throw new Error('both connection methods were blocked. open the /exec URL in a new tab to check deployment access. use the updated Code.gs and deploy a new version; then open the planner directly in your browser.');
    throw e;
  }finally{clearTimeout(timer);}
}
async function syncRPC(action,fields={}){
  if(!navigator.onLine)throw new Error('offline — changes stay in this browser until you reconnect');
  const payload={protocol:1,key:syncConfig.key,action,...fields};
  let result,bridge;
  if(directSyncURL===syncConfig.url)result=await directSyncRequest(payload);
  else{
    try{bridge=await bridgeConnect();}
    catch(e){setSyncStatus('embedded connection unavailable — trying direct connection…');directSyncURL=syncConfig.url;}
    // Only fall back before sending a request. Never retry an uncertain write automatically.
    result=bridge?await bridge.request(payload):await directSyncRequest(payload);
  }
  if(!result?.ok){const error=new Error(result?.error||'unexpected response from apps script');error.code=result?.code;throw error;}
  if(result.protocol!==1||typeof result.revision!=='string'||typeof result.sheetId!=='string')throw new Error('this endpoint is not the planner sync script');
  if(syncConfig.sheetId&&syncConfig.sheetId!==result.sheetId)throw new Error('this deployment now points to a different spreadsheet. disconnect and connect again to choose its data.');
  return {...result,data:validateData(result.data)};
}
function openSync(){syncOpen=true;syncDraft={url:syncConfig.url,key:syncConfig.key,auto:syncConfig.auto};render();}
function countSummary(d){return `${d.courses.length} courses · ${d.events.length} classes · ${d.payments.length} payments · ${d.holidays.length} days off`;}
function conflictValue(v){if(v===undefined)return 'deleted';if(v&&typeof v==='object')return JSON.stringify(v);return String(v);}
function syncDialog(){
  if(!syncOpen)return '';
  return `<div class="overlay" data-close="sync"><div class="editor sync-editor" data-stop>
    <h2>google sheets sync 🔗</h2><p class="form-note">connection v2 · embedded + direct connection</p><p class="desc">optional two-way sync · offline changes stay on this device until synced</p>
    <form id="syncForm">
      ${field('apps script web app url',`<input id="sync-url" type="url" required autocomplete="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(syncDraft.url)}" ${syncBusy?'disabled':''}>`)}
      ${field('private sync key',`<input id="sync-key" type="password" required autocomplete="off" spellcheck="false" placeholder="paste the key from apps script setup" value="${esc(syncDraft.key)}" ${syncBusy?'disabled':''}>`)}
      <label class="allocation-option"><input id="sync-auto" type="checkbox" ${syncDraft.auto?'checked':''} ${syncBusy?'disabled':''}> auto-sync while this planner is open (about every minute)</label>
      <p id="sync-message" class="sync-message" role="status">${esc(syncStatus)}</p>
      ${syncConfig.lastSync?`<p class="form-note">last synced: ${esc(new Date(syncConfig.lastSync).toLocaleString('en-GB',{timeZone:TZ}))} · thailand time${syncPending()?' · local changes waiting':''}</p>`:''}
      <div class="editor-actions"><button class="soft" type="button" data-sync-action="download-script">apps script file</button><button class="soft primary" type="submit" ${syncBusy?'disabled':''}>${syncConfig.base?'save connection settings':'connect & compare'}</button></div>
    </form>
    ${syncComparison&&!syncConfig.base?`<div class="sync-compare"><h3>choose your starting copy</h3><p><b>this planner:</b> ${countSummary(data)}</p><p><b>google sheets:</b> ${countSummary(syncComparison.data)}</p><p class="form-note">choose the copy to start with. after this, edits sync in both directions. back up this planner before replacing it.</p><div class="editor-actions"><button class="soft" data-sync-action="initial-pull" ${syncBusy?'disabled':''}>start with sheets</button><button class="soft primary" data-sync-action="initial-push" ${syncBusy?'disabled':''}>start with this planner</button></div></div>`:''}
    ${syncConflict?`<div class="sync-conflicts"><h3>${syncConflict.conflicts.length} competing edit${syncConflict.conflicts.length===1?'':'s'}</h3><p class="form-note">both copies changed the same field, or one deleted an edited item. choose what to keep.</p>${syncConflict.conflicts.map((c,i)=>`<div class="sync-conflict"><b>${esc(c.label)} · ${esc(c.field)}</b><div class="conflict-values"><p><small>this planner</small>${esc(conflictValue(c.local))}</p><p><small>google sheets</small>${esc(conflictValue(c.remote))}</p></div><label>keep<select data-sync-choice="${i}"><option value="">choose…</option><option value="local" ${syncConflict.choices[c.key]==='local'?'selected':''}>this planner</option><option value="remote" ${syncConflict.choices[c.key]==='remote'?'selected':''}>google sheets</option></select></label></div>`).join('')}<button class="soft primary" data-sync-action="resolve" ${syncBusy?'disabled':''}>apply choices & sync</button></div>`:''}
    ${syncConfig.base?`<div class="editor-actions"><button class="soft danger" data-sync-action="disconnect" ${syncBusy?'disabled':''}>disconnect</button><button class="soft primary" data-sync-action="now" ${syncBusy?'disabled':''}>${syncBusy?'syncing…':'sync now ↔'}</button></div>`:''}
    <details class="sync-help"><summary>setup & how sync works</summary><ol><li>create a blank google sheet → extensions → apps script.</li><li>download the apps script file above; paste its contents into Code.gs.</li><li>in apps script: services + → google sheets api → add.</li><li>run <b>setupPlannerSync_</b>, authorize, and copy the private key shown in the sheet.</li><li>deploy → new deployment → web app. execute as <b>me</b>; access <b>anyone</b>. copy the url ending in <b>/exec</b>.</li><li>paste the url and key here → connect & compare → choose your starting copy.</li></ol><p>the sheet stays private. the deployment accepts only requests with your private key. keep the key to yourself; connection settings are saved in this browser and excluded from calendar backups.</p><p>edit values in the courses, sessions, payments and days_off tabs. use dates like 2026-09-10 and times like 18:30. keep existing ids and headers. use new unique ids for new rows. finish editing in sheets before syncing; use a separate tab for formulas.</p><p>sync runs only while this html file is open. disconnect keeps both copies. when adding another device, start with sheets to avoid uploading its starter data.</p></details>
  </div></div>`;
}
async function connectSync(){
  if(syncBusy)return;
  if(document.getElementById('syncForm'))syncDraft={url:document.getElementById('sync-url').value,key:document.getElementById('sync-key').value,auto:document.getElementById('sync-auto').checked};
  if(!validScriptURL(syncDraft.url.trim())){toast('paste the deployed script.google.com url ending in /exec, without extra parameters','error');return;}
  if(syncDraft.key.trim().length<32){toast('paste the full private key from setup','error');return;}
  directSyncURL=null;
  const changed=syncConfig.url!==syncDraft.url.trim()||syncConfig.key!==syncDraft.key.trim();
  if(changed&&syncConfig.base){askConfirm('change this connection?','the next connection will ask which copy to start with. your current local data stays here.',()=>{syncConfig={url:syncDraft.url.trim(),key:syncDraft.key.trim(),auto:syncDraft.auto,base:null,sheetId:'',lastSync:'',blocked:false};saveSyncConfig();destroySyncBridge();connectSync();});return;}
  syncConfig={...syncConfig,url:syncDraft.url.trim(),key:syncDraft.key.trim(),auto:syncDraft.auto};saveSyncConfig();
  if(changed)destroySyncBridge();
  syncBusy=true;setSyncStatus('connecting…');render();
  try{const remote=await syncRPC('read');syncComparison=remote;setSyncStatus(syncConfig.base?'connected — ready to sync':'connected — choose your starting copy');}
  catch(e){setSyncStatus(e.message);destroySyncBridge();}
  finally{syncBusy=false;render();scheduleSync();}
}
function applySyncedLocal(next){
  if(sameData(next,data))return true;
  syncApplying=true;try{return commit(next,'calendar updated from sheets');}finally{syncApplying=false;}
}
function showSyncConflicts(result,base,local,remote){
  syncConflict={...result,base:clone(base),local:clone(local),remote,choices:{}};
  syncConfig.blocked=true;saveSyncConfig();setSyncStatus('sync paused — choose which competing edits to keep');if(!syncOpen)openSync();else render();
}
async function finishSync(remote,localAtStart){
  if(otherEditorOpen()){setSyncStatus('sheet checked — close the class editor, then sync again');return;}
  const rebased=threeWay(syncShape(localAtStart),syncShape(data),syncShape(remote.data));
  if(rebased.conflicts.length){showSyncConflicts(rebased,localAtStart,data,remote);return;}
  const next=validateData(rebased.data);
  if(!applySyncedLocal(next))throw new Error('sheets received the data, but this browser could not apply it. resolve the storage warning, then sync again.');
  syncConfig.base=clone(remote.data);syncConfig.sheetId=remote.sheetId;syncConfig.lastSync=new Date().toISOString();syncConfig.blocked=false;syncConflict=null;syncComparison=null;saveSyncConfig();
  setSyncStatus(sameData(data,remote.data)?'up to date ✓':'new local changes waiting to sync');
}
async function syncNow(manual=true){
  if(syncBusy)return;
  if(!syncConfig.base){if(manual)openSync();return;}
  if(otherEditorOpen()){if(manual)toast('save or close the open editor before syncing','info');return;}
  if(!manual&&syncConfig.blocked)return;
  syncBusy=true;setSyncStatus('syncing…');if(syncOpen)render();
  try{
    const remote=await syncRPC('read'),local=clone(data),base=clone(syncConfig.base);
    const result=threeWay(syncShape(base),syncShape(local),syncShape(remote.data));
    if(result.conflicts.length){showSyncConflicts(result,base,local,remote);return;}
    const merged=validateData(result.data);
    const ack=sameData(merged,remote.data)&&!remote.needsNormalization?remote:await syncRPC('write',{revision:remote.revision,data:merged});
    await finishSync(ack,local);
  }catch(e){setSyncStatus(e.code==='CONFLICT'?'sheets changed during sync. nothing was overwritten; sync again.':e.message);if(manual)toast(syncStatus,'error');}
  finally{syncBusy=false;if(syncOpen)render();paintSyncStatus();if(syncPending()&&!syncConfig.blocked&&syncStatus.includes('new local'))scheduleSync();}
}
async function firstSync(direction){
  if(syncBusy||!syncComparison)return;
  syncBusy=true;setSyncStatus('setting up your first sync…');render();
  try{
    const remote=await syncRPC('read');
    if(remote.revision!==syncComparison.revision){syncComparison=remote;setSyncStatus('sheets changed. review the updated counts and choose again.');return;}
    const local=clone(data);
    if(direction==='pull'){
      if(!applySyncedLocal(remote.data))throw new Error('could not replace local data; resolve the storage warning first');
      syncConfig.base=clone(remote.data);syncConfig.sheetId=remote.sheetId;syncConfig.lastSync=new Date().toISOString();syncConfig.blocked=false;syncComparison=null;saveSyncConfig();setSyncStatus('up to date ✓');
    }else{const ack=await syncRPC('write',{revision:remote.revision,data:local});await finishSync(ack,local);}
  }catch(e){setSyncStatus(e.message);toast(e.message,'error');}
  finally{syncBusy=false;render();scheduleSync();}
}
async function resolveSync(){
  if(syncBusy||!syncConflict)return;
  const c=syncConflict;
  if(c.conflicts.some(x=>!c.choices[x.key])){toast('choose a copy for every conflicting edit','info');return;}
  if(!sameData(c.local,data)){syncConflict=null;syncConfig.blocked=false;saveSyncConfig();return syncNow(true);}
  const resolved=threeWay(syncShape(c.base),syncShape(c.local),syncShape(c.remote.data),c.choices);
  let merged;try{merged=validateData(resolved.data);}catch(e){toast('those choices do not form a valid planner: '+e.message,'error');return;}
  syncBusy=true;render();
  try{const ack=sameData(merged,c.remote.data)?await syncRPC('read'):await syncRPC('write',{revision:c.remote.revision,data:merged});
    if(sameData(merged,c.remote.data)&&ack.revision!==c.remote.revision)throw new Error('sheets changed again. click sync now to compare the latest edits.');
    if(!applySyncedLocal(ack.data))throw new Error('could not apply the result locally; resolve the storage warning');
    syncConfig.base=clone(ack.data);syncConfig.sheetId=ack.sheetId;syncConfig.lastSync=new Date().toISOString();syncConfig.blocked=false;syncConflict=null;saveSyncConfig();setSyncStatus('up to date ✓');
  }catch(e){setSyncStatus(e.message);toast(e.message,'error');}
  finally{syncBusy=false;render();}
}
document.addEventListener('input',ev=>{if(!syncDraft)return;if(ev.target.id==='sync-url')syncDraft.url=ev.target.value;if(ev.target.id==='sync-key')syncDraft.key=ev.target.value;if(ev.target.id==='sync-auto')syncDraft.auto=ev.target.checked;});
document.addEventListener('change',ev=>{const i=ev.target.dataset.syncChoice;if(i!==undefined&&syncConflict)syncConflict.choices[syncConflict.conflicts[+i].key]=ev.target.value;});
document.addEventListener('submit',ev=>{if(ev.target.id==='syncForm'){ev.preventDefault();connectSync();}});
document.addEventListener('click',ev=>{
  const button=ev.target.closest('[data-sync-action]');if(!button||button.disabled)return;
  const action=button.dataset.syncAction;
  if(action==='open')openSync();
  if(action==='now')syncNow(true);
  if(action==='download-script')download('Code.gs',APPS_SCRIPT_SOURCE,'text/plain;charset=utf-8');
  if(action==='initial-push')askConfirm('start with this planner?','this replaces the four planner tabs in sheets with this browser’s data. other sheet tabs are untouched.',()=>firstSync('push'));
  if(action==='initial-pull')askConfirm('start with google sheets?','this replaces this browser’s calendar with the sheet copy. download a backup first if you want to keep this local copy.',()=>firstSync('pull'));
  if(action==='resolve')resolveSync();
  if(action==='disconnect')askConfirm('disconnect google sheets?','local and sheet data both stay. automatic sync stops and this browser forgets the connection key.',()=>{clearTimeout(syncTimer);destroySyncBridge();syncConfig={url:'',key:'',auto:false,base:null,lastSync:'',sheetId:'',blocked:false};saveSyncConfig();syncComparison=syncConflict=null;syncStatus='not connected';syncDraft={url:'',key:'',auto:false};render();});
});
window.addEventListener('online',()=>{setSyncStatus('back online — ready to sync');scheduleSync();});
window.addEventListener('offline',()=>setSyncStatus('offline — changes stay in this browser'));
setInterval(()=>{if(syncConfig.auto&&syncConfig.base&&!syncConfig.blocked&&!syncOpen&&!document.hidden&&!otherEditorOpen())syncNow(false);},60000);

window.addEventListener('storage',ev=>{if(ev.key===SYNC_KEY){destroySyncBridge();syncConfig=readSyncConfig();syncComparison=syncConflict=null;syncStatus='connection settings changed in another tab';if(syncOpen)syncDraft={url:syncConfig.url,key:syncConfig.key,auto:syncConfig.auto};render();}});

render();
if(syncConfig.auto&&syncConfig.base)scheduleSync();

</script>
